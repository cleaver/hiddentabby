<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HiddenTabby — Manage groups</title>
    <link rel="stylesheet" href="manager.css">
    <script type="module" src="manager.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <div class="brand-mark" aria-hidden="true"><img src="icons/manager-logo.png" alt=""></div>
        <div>
          <p class="eyebrow">Workspace manager</p>
          <h1>HiddenTabby</h1>
        </div>
      </header>

      <p id="status" class="status" role="status" aria-live="polite">Loading your groups…</p>

      <section class="panel" aria-labelledby="groups-heading">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Organize</p>
            <h2 id="groups-heading">Groups</h2>
          </div>
          <form id="create-form" class="create-form">
            <label class="sr-only" for="group-name">New group name</label>
            <input id="group-name" name="name" maxlength="40" placeholder="New group name" required>
            <button class="button primary" type="submit">Create group</button>
          </form>
        </div>
        <div id="groups" class="group-grid"></div>
      </section>

      <footer class="page-footer">HiddenTabby closes inactive-group tabs and restores them when you switch back. Restored pages may lose unsaved form data or live page state.</footer>
    </main>
  </body>
</html>
