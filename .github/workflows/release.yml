name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Check tag matches extension version
        run: |
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const { version } = JSON.parse(readFileSync("manifest.json", "utf8"));
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match manifest version ${version}.`);
          }
          NODE

      - name: Run unit and integration tests
        run: npm test

      - name: Run Chromium end-to-end tests
        run: npm run test:e2e
        env:
          BROWSER_BIN: /usr/bin/chromium

      - name: Check packaged ZIP
        run: unzip -t dist/HiddenTabby.zip

      - name: Create SHA-256 checksum
        run: cd dist && sha256sum HiddenTabby.zip > HiddenTabby.zip.sha256

      - name: Attest release ZIP provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/HiddenTabby.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/HiddenTabby.zip \
            dist/HiddenTabby.zip.sha256 \
            --verify-tag \
            --generate-notes \
            --title "HiddenTabby $GITHUB_REF_NAME"
